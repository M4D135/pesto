name: Attest release evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Generate inspection evidence for the supplied release
        run: |
          python tools/prepare_dev.py
          python tools/release_assurance.py create --source . --output out/release
      # Attest the reports generated HERE, never imply that this job compiled Pesto.exe.
      # A supported GitHub plan and OIDC/attestations permissions are required.
      - name: Attest generated JSON evidence only
        id: evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: out/release/*.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attested-release-evidence
          path: |
            out/release
            ${{ steps.evidence.outputs.bundle-path }}
          if-no-files-found: error
