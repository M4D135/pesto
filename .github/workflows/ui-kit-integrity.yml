name: UI kit integrity (offline)

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [master, codex/pesto-v2-20261023]

permissions:
  contents: read

jobs:
  ui-kit:
    name: Verify pinned tool and declared local UI bytes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify lock before executing the offline comparator
        run: python -I -S v2/tools/check-ui-kit.py
