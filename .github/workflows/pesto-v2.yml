            socleReleaseUrl='https://github.com/M4D135/socle-windows/releases/tag/webview2-156.0.4314.42'
          }
          # -InputObject keeps a one-record JSON array; piping a single record would emit a bare object.
          ConvertTo-Json -InputObject @($record) -Depth 5 | Set-Content -Encoding utf8 out/evidence/artifacts.json
      - name: Seal the exact tested files on the lab runner
        id: lab-handoff
        if: success() && env.LAB_RELEASE_HANDOFF == 'true'
        env:
          PESTO_PUBLISH_RELEASE: 'true'
          PESTO_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          & node tools/release/lab-handoff.mjs seal out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && env.LAB_RELEASE_HANDOFF != 'true'
        with:
          name: Pesto-V2-Windows-evidence-${{ github.sha }}
          path: v2/out/evidence
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.LAB_RELEASE_HANDOFF != 'true'
        with:
          name: Pesto-V2-PROD-LIGHT-${{ env.PACK_DISTRIBUTION }}-${{ github.sha }}
          path: v2/out/Pesto_V2_PROD-LIGHT_${{ env.PACK_DISTRIBUTION }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/master' && github.repository == 'M4D135/pesto'
    needs: windows-critical
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'windows-2025' }}
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PESTO_PUBLISH_RELEASE: 'true'
      PESTO_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      PESTO_LAB_HANDOFF_SHA256: ${{ needs.windows-critical.outputs.lab_handoff_sha256 }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # v4.3.0 pin checked against the official actions/download-artifact tag.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.LAB_RELEASE_HANDOFF != 'true'
        with:
          name: Pesto-V2-PROD-LIGHT-official-${{ github.sha }}
          path: release/PROD-LIGHT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.LAB_RELEASE_HANDOFF != 'true'
        with:
          name: Pesto-V2-Windows-evidence-${{ github.sha }}
          path: release/evidence
      - name: Restore the lab handoff bound to the successful Windows job
        if: env.LAB_RELEASE_HANDOFF == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & node v2/tools/release/lab-handoff.mjs restore release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive the evidence from this exact successful Windows job
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path release/evidence/* -DestinationPath release/Pesto_V2_Windows_evidence.zip -CompressionLevel Optimal
      - name: Publish tested ZIP bytes only after draft assets and GitHub digests match
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          & node v2/tools/release/publish-release.mjs release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
