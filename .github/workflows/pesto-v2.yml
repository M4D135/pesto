name: Pesto V2 candidate and Windows isolation

on:
  push:
    branches: [master, codex/pesto-v2-20261023]
    paths: ['v2/**', '.github/workflows/pesto-v2.yml', '.gitattributes']
  pull_request:
    branches: [master, codex/pesto-v2-20261023]
    paths: ['v2/**', '.github/workflows/pesto-v2.yml', '.gitattributes']
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the exact Windows-tested official packs (master only)'
        type: boolean
        default: false
      expected_source_sha:
        description: 'Exact reviewed 40-character source SHA; required for publication'
        type: string
        default: ''
      runner:
        description: 'Windows hébergé par GitHub ; aucun runner auto-hébergé sur ce dépôt public (08/11/2026)'
        type: choice
        options: [windows-2025]
        default: windows-2025

permissions:
  contents: read
env:
  PESTO_SELECTED_RUNNER: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'windows-2025' }}
  LAB_RELEASE_HANDOFF: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && (inputs.runner == 'pesto-lab' || inputs.runner == 'pesto-ci') && 'true' || 'false' }}
concurrency:
  group: pesto-v2-${{ github.sha }}-${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'release' || 'candidate' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_release) }}

jobs:
  windows-critical:
    outputs:
      version: ${{ steps.package-policy.outputs.version }}
      distribution: ${{ steps.package-policy.outputs.distribution }}
      lab_handoff_sha256: ${{ steps.lab-handoff.outputs.manifest_sha256 }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'windows-2025' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.runner == 'pesto-lab' || inputs.runner == 'pesto-ci') && 120 || 45 }}
    defaults:
      run:
        shell: pwsh
        working-directory: v2
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PACK_DISTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'official' || 'candidate' }}
      PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release && 'true' || 'false' }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      WEBVIEW2_VERSION: '156.0.4314.42'
      WEBVIEW2_CAB_SHA256: cb4612ce79a62a0be094301a72f73cf91bb250f5e83dc51886f66a083fc0694f
      WEBVIEW2_EXE_SHA256: 337a496fffec9940ef7142e67162f80e40c878cb8fc2af66e5bd9aa75ffcdbae
      UPDATE_BASELINE_COMMIT: 962f3ba0826730077b2ccd918e0f8415870646bb
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Bind packaging and publication to the reviewed source
        id: package-policy
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = $env:PUBLISH_RELEASE -ceq 'true'
          if ($env:PESTO_SELECTED_RUNNER -cin @('pesto-lab','pesto-ci') -and
              ($env:RUNNER_ENVIRONMENT -cne 'self-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_NAME -cne $env:PESTO_SELECTED_RUNNER)) {
            throw 'The Windows runner must match the exact name selected for this dispatch.'
          }
          if ($publish -and ($env:GITHUB_REF -cne 'refs/heads/master' -or
              $env:EXPECTED_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or $env:EXPECTED_SOURCE_SHA -cne $env:GITHUB_SHA)) {
            throw 'Publication requires master at the exact reviewed source SHA.'
          }
          if ($env:PACK_DISTRIBUTION -cne $(if ($publish) { 'official' } else { 'candidate' })) { throw 'Unexpected package distribution.' }
          $spec = Get-Content tools/pack/pack-manifest.json -Raw | ConvertFrom-Json
          if ($spec.version -cnotmatch '^2\.[0-9]+\.[0-9]+$') { throw 'A complete Pesto V2 release version is required.' }
          "version=$($spec.version)" >> $env:GITHUB_OUTPUT
          "distribution=$env:PACK_DISTRIBUTION" >> $env:GITHUB_OUTPUT
      - name: Storage Preflight Evidence
        if: env.LAB_RELEASE_HANDOFF != 'true'
        id: storage-preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = 'out/evidence'
          if (!(Test-Path $evidenceDir)) { New-Item -ItemType Directory -Path $evidenceDir -Force | Out-Null }
          $obj = [PSCustomObject]@{
            kind        = 'pesto.artifact-storage-preflight'
            sourceCommit = $env:GITHUB_SHA
            runId       = $env:GITHUB_RUN_ID
            runAttempt  = $env:GITHUB_RUN_ATTEMPT
            distribution = $env:PACK_DISTRIBUTION
          }
          $json = $obj | ConvertTo-Json -Compress
          Set-Content -Path "$evidenceDir/storage-preflight.json" -Value $json -Encoding utf8

      - name: Upload Storage Preflight Artifact
        if: env.LAB_RELEASE_HANDOFF != 'true'
        id: upload-storage-preflight
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Pesto-V2-storage-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: v2/out/evidence/storage-preflight.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Obtain the pinned previous source for a real cross-build update
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: M4D135/pesto
          ref: 962f3ba0826730077b2ccd918e0f8415870646bb
          path: baseline
          persist-credentials: false
          sparse-checkout: |
            v2
            DEV/wad
      # Tag v5.4.0 verified against https://api.github.com/repos/actions/setup-dotnet/git/ref/tags/v5.4.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.302'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verify the pinned UI kit before packaging
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path out/evidence -Force | Out-Null
          & python -I -S tools/check-ui-kit.py | Tee-Object -FilePath out/evidence/ui-kit-source.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows candidate and isolated test assemblies
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path out/evidence -Force | Out-Null
          dotnet --info | Out-File out/evidence/dotnet-info.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkPolicy = (Get-Content global.json -Raw | ConvertFrom-Json).sdk
          $sdk = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceHead -cne $env:GITHUB_SHA) { throw 'The checked out source differs from this workflow run.' }
          $sdkExact = $sdk -ceq $sdkPolicy.version -and $sdkPolicy.rollForward -ceq 'disable'
          [ordered]@{ sourceCommit=$env:GITHUB_SHA; sourceHead=$sourceHead; expectedSdkVersion=$sdkPolicy.version; sdkVersion=$sdk; rollForward=$sdkPolicy.rollForward; success=$sdkExact } |
            ConvertTo-Json | Set-Content -Encoding utf8 out/evidence/candidate-sdk.json
          if (-not $sdkExact) { throw 'The candidate must use the exact SDK delivered in global.json.' }
          dotnet build tests/Pesto.Engine.Tests/Pesto.Engine.Tests.csproj -c Release --disable-build-servers -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Pesto.Bridge.Tests/Pesto.Bridge.Tests.csproj -c Release --disable-build-servers -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/qualification/Pesto.UpdateQualification/Pesto.UpdateQualification.csproj -c Release --disable-build-servers -m:1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish src/Pesto.App/Pesto.App.csproj -c Release -r win-x64 --self-contained true --disable-build-servers -m:1 -o out/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baselineHead = (& git -C ../baseline rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $baselineHead -ne $env:UPDATE_BASELINE_COMMIT) { throw 'Unexpected update baseline source commit' }
          dotnet publish ../baseline/v2/src/Pesto.App/Pesto.App.csproj -c Release -r win-x64 --self-contained true --disable-build-servers -m:1 -o out/baseline-publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Obtain pinned Microsoft fixed WebView2 runtime and build reference socle
        run: |
          $ErrorActionPreference = 'Stop'
          $cab = Join-Path $env:RUNNER_TEMP 'Pesto-WebView2-Fixed.cab'
          $runtime = Join-Path $env:RUNNER_TEMP 'Pesto-WebView2-Fixed'
          $uri = 'https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/074c0930-36ad-4756-9d04-dfe0e503bd94/Microsoft.WebView2.FixedVersionRuntime.156.0.4314.42.x64.cab'
          Invoke-WebRequest -Uri $uri -OutFile $cab
          if ((Get-FileHash $cab -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WEBVIEW2_CAB_SHA256) { throw 'Microsoft CAB hash mismatch' }
          New-Item -ItemType Directory -Path $runtime | Out-Null
          & "$env:SystemRoot\System32\expand.exe" '-F:*' $cab $runtime | Out-File out/evidence/runtime-extraction.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $executables = @(Get-ChildItem -LiteralPath $runtime -Recurse -File -Filter msedgewebview2.exe)
          if ($executables.Count -ne 1) { throw 'Exactly one fixed runtime is required' }
          if ((Get-FileHash $executables[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:WEBVIEW2_EXE_SHA256) { throw 'Microsoft runtime executable hash mismatch' }
          $socleRoot = Join-Path (Get-Location).Path 'out/socle'
          $socleTarget = Join-Path $socleRoot 'wad/runtime/webview2'
          if (Test-Path $socleRoot) { Remove-Item -LiteralPath $socleRoot -Recurse -Force }
          # The destination does not exist yet, so Copy-Item creates webview2 itself instead of nesting the CAB folder.
          New-Item -ItemType Directory -Path (Split-Path $socleTarget) -Force | Out-Null
          Copy-Item -LiteralPath $executables[0].Directory.FullName -Destination $socleTarget -Recurse
          $indexPath = 'vendor/socle/webview2-156.0.4314.42.files.json'
          if (!(Test-Path $indexPath)) { throw "Socle index not found: $indexPath" }
          $index = Get-Content $indexPath -Raw | ConvertFrom-Json
          if ($index.root -cne 'runtime/webview2') { throw "Socle index root mismatch: expected runtime/webview2, got $($index.root)" }
          $localBase = Join-Path $socleRoot 'wad'
          $expectedPaths = @{}
          foreach ($f in $index.files) { $expectedPaths[$f.path.ToLowerInvariant()] = $f }
          $actualFiles = @(Get-ChildItem -LiteralPath $socleTarget -Recurse -File)
          $actualPaths = @{}
          foreach ($af in $actualFiles) {
            $rel = $af.FullName.Substring($localBase.Length + 1).Replace('\','/').ToLowerInvariant()
            $actualPaths[$rel] = $af
          }
          foreach ($ep in $expectedPaths.Keys) {
            if (-not $actualPaths.ContainsKey($ep)) { throw "Socle tree missing file: $ep" }
            $af = $actualPaths[$ep]
            if ($af.Length -ne $expectedPaths[$ep].bytes) { throw "Socle tree size mismatch for $ep" }
            $h = (Get-FileHash -LiteralPath $af.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($h -cne $expectedPaths[$ep].sha256) { throw "Socle tree hash mismatch for $ep" }
          }
          foreach ($ap in $actualPaths.Keys) {
            if (-not $expectedPaths.ContainsKey($ap)) { throw "Socle tree unexpected file: $ap" }
          }
          if ($actualFiles.Count -ne $index.file_count) { throw "Socle tree file count mismatch: expected $($index.file_count), got $($actualFiles.Count)" }
          $totalBytes = ($actualFiles | Measure-Object -Property Length -Sum).Sum
          $indexSha = (Get-FileHash -LiteralPath $indexPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "PESTO_SOCLE_ROOT=$socleRoot" >> $env:GITHUB_ENV
          [ordered]@{ schemaVersion=1; kind='pesto.socle-match'; success=$true; version=$env:WEBVIEW2_VERSION;
            cabSha256=$env:WEBVIEW2_CAB_SHA256; executableSha256=$env:WEBVIEW2_EXE_SHA256;
            indexSha256=$indexSha; fileCount=$index.file_count; bytes=$totalBytes;
            root='wad/runtime/webview2' } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 out/evidence/socle-match.json
      - name: Assemble PROD-LIGHT, DEV and update baseline
        run: |
          $ErrorActionPreference = 'Stop'
          & node ../baseline/v2/tools/pack/make-pack.mjs --source out/baseline-publish --dest out/baseline-PROD-LIGHT --channel PROD --source-commit $env:UPDATE_BASELINE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & node ../baseline/v2/tools/pack/make-pack.mjs --verify out/baseline-PROD-LIGHT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $baseline = Get-Content 'out/baseline-PROD-LIGHT/wad/Pesto.package.json' -Raw | ConvertFrom-Json
          if ($baseline.sourceCommit -ne $env:UPDATE_BASELINE_COMMIT) { throw 'Baseline manifest source mismatch' }
          $oldExe = (Get-FileHash 'out/baseline-PROD-LIGHT/Pesto.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $packs = @(
            @{ Name='PROD-LIGHT'; Channel='PROD' },
            @{ Name='DEV'; Channel='DEV' }
          )
          foreach ($p in $packs) {
            & node tools/pack/make-pack.mjs --source out/publish --dest "out/$($p.Name)" --channel $p.Channel --source-commit $env:GITHUB_SHA --distribution $env:PACK_DISTRIBUTION
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & node tools/pack/make-pack.mjs --verify "out/$($p.Name)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Compress-Archive -Path "out/$($p.Name)" -DestinationPath "out/Pesto_V2_$($p.Name)_$env:PACK_DISTRIBUTION.zip" -CompressionLevel Optimal
          }
          $newExe = (Get-FileHash 'out/PROD-LIGHT/Pesto.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($oldExe -eq $newExe) { throw 'Cross-build qualification requires two different executable hashes' }
          [ordered]@{ sourceCommit=$env:UPDATE_BASELINE_COMMIT; build='rebuilt-from-pinned-source-in-this-run'; channel='PROD';
            executableSha256=$oldExe; candidateExecutableSha256=$newExe;
            note='La base 962f3ba ne sait pas fabriquer un DEV LIGHT ; aucune base DEV ni mise a jour inter-builds DEV n est qualifiee.' } |
            ConvertTo-Json | Set-Content -Encoding utf8 out/evidence/update-baseline-PROD-LIGHT.json
          Compress-Archive -Path out/baseline-PROD-LIGHT -DestinationPath out/Pesto_V2_baseline-PROD-LIGHT.zip -CompressionLevel Optimal
      - name: Record Windows desktop context before native qualification
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/qualification/Write-WindowsDesktopObservation.ps1 -OutputPath out/evidence/windows-desktop.json -SourceCommit $env:GITHUB_SHA
      - name: Native configuration buttons, default written in a pack copy and legacy custom pack preparation — isolated profiles only
        run: |
          $ErrorActionPreference = 'Stop'
          # Ordered exactly as NativeConfigurationQualification.cs records them (schema 3, 2.0.14 default written in place).
          $expectedChecks = @(
            'installationCopyExact', 'parentReady', 'isolatedConfigurationPage', 'nativeExportFromButton', 'nativeExportExact', 'noExportTemporaryFile',
            'settingsUnchangedBeforeConfirmation', 'settingsSavedFromButton', 'settingsBackupExact', 'importCancelled', 'exportCancelled',
            'invalidEncodingRejected', 'importPreviewBeforeWrite', 'importConfirmationCancelled', 'nativeImportFromButton', 'importRoundTrip',
            'importBackupExact', 'defaultWaitsForConfirmation', 'defaultConfirmationCancelled', 'readOnlyRuleApplied', 'readOnlyRefusedByEngine',
            'readOnlyRefusalVisible', 'readOnlyLeftNothing', 'readOnlyRuleRemoved', 'defaultWrittenFromButton', 'defaultWrittenVisible',
            'defaultPackIdentityUnchanged', 'defaultExecutableUnchanged', 'defaultMatchesUiExport', 'noDefaultDebris', 'defaultUnchangedFromButton',
            'freshProfileImportsDefaults', 'existingProfilePreserved', 'existingProfileChoiceRemembered', 'legacyCustomPackFixtureSealed',
            'maintenanceFolderInspectedFromButton', 'maintenancePreparedFromButton', 'maintenancePreparedCopyExact',
            'maintenanceInstallWaitsForConfirmation', 'maintenanceInstallConfirmationCancelled', 'maintenanceStatusFromButton',
            'noForbiddenEffects', 'operatorDataPreserved', 'sourcePackUnchanged'
          )
          $channel = 'PROD-LIGHT'
          $packDir = "out/$channel"
          if (Test-Path (Join-Path $packDir 'wad/runtime/webview2')) { throw "Pack $channel must not contain wad/runtime/webview2" }
          if (@(Get-ChildItem -LiteralPath $packDir -Recurse -File -Filter msedgewebview2.exe).Count -ne 0) { throw "Pack $channel must not contain msedgewebview2.exe" }
          if (Test-Path (Join-Path $packDir 'wad/defaults')) { throw "Pack $channel must not contain wad/defaults before the configuration bench" }
          $report = Join-Path ([IO.Path]::GetTempPath()) ("Pesto-configuration-$channel-" + [guid]::NewGuid().ToString('N'))
          $exe = (Resolve-Path "$packDir/Pesto.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--qualify-configuration', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(600000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "Native configuration timed out for $channel"
          }
          if (Test-Path (Join-Path $report 'proof.json')) { Copy-Item (Join-Path $report 'proof.json') "out/evidence/native-configuration-$channel.json" }
          $captures = "out/evidence/native-configuration-$channel"
          New-Item -ItemType Directory -Path $captures -Force | Out-Null
          if (Test-Path (Join-Path $report 'coexistence')) {
            Get-ChildItem (Join-Path $report 'coexistence') -File -Filter '*.png' | Copy-Item -Destination $captures
          }
          # The bench writes its default into a copy only: the pack reused by the next steps must stay without wad/defaults.
          if (Test-Path (Join-Path $packDir 'wad/defaults')) { throw "Native configuration wrote wad/defaults into $packDir" }
          if ($process.ExitCode -ne 0) { throw "Native configuration failed for $channel (exit $($process.ExitCode))" }
          $proof = Get-Content "out/evidence/native-configuration-$channel.json" -Raw | ConvertFrom-Json
          if ($proof.schemaVersion -ne 3 -or $proof.channel -ne 'PROD' -or $proof.uiScope -ne 'mainform-webview2-buttons-and-native-dialogs') { throw "Native configuration scope incorrect for $channel" }
          if ($proof.installationUnderTest -cne 'temporary-copy-of-running-pack') { throw "Native configuration must act on a temporary copy for $channel" }
          if ((Get-Content "$packDir/wad/Pesto.package.json" -Raw | ConvertFrom-Json).webview2Runtime -cne 'evergreen') { throw "Pack $channel must declare webview2Runtime evergreen" }
          if ($proof.runtimeSource -cne 'evergreen') { throw "Native configuration runtimeSource must be evergreen for $channel" }
          if (@($proof.checks).Count -ne $expectedChecks.Count -or @(Compare-Object $expectedChecks @($proof.checks) -SyncWindow 0 -CaseSensitive).Count -ne 0) { throw "Native configuration checks incomplete for $channel" }
          foreach ($field in @('success', 'parentClosed', 'temporaryDataRemoved', 'sourcePackUnchanged', 'sourcePackDefaultsAbsent', 'nativeExportFromUiQualified', 'nativeImportFromUiQualified', 'installationDefaultButtonFlowQualified', 'readOnlyRefusalQualified', 'legacyCustomPackPreparedFromUiQualified', 'maintenanceInspectionPreparationFromUiQualified', 'maintenanceInstallConfirmationCancelled')) {
            if ($proof.$field -ne $true) { throw "Native configuration missing $field for $channel" }
          }
          foreach ($field in @('adQualification', 'adExecuted', 'realUac', 'ordinaryProfileAccess', 'uncQualification', 'nativeUpdateInstallFromUiQualified', 'readOnlyRuleLeftInPlace')) {
            if ($proof.$field -ne $false) { throw "Native configuration overclaims $field for $channel" }
          }
          foreach ($field in @('forbiddenBackendInvocations', 'forbiddenHostInvocations')) {
            if ($proof.$field -ne 0) { throw "Native configuration unexpected $field for $channel" }
          }
          if ($proof.installationDefault.distribution -cne $env:PACK_DISTRIBUTION -or $proof.installationDefault.packFingerprint -cne $proof.sourceFingerprint -or $proof.installationDefault.state -cne 'local') { throw "Native configuration changed the pack identity for $channel" }
          if ($proof.readOnlyRefusal.code -cne 'config.default_readonly' -or $proof.readOnlyRefusal.ruleRemoved -ne $true) { throw "Native configuration read-only refusal incomplete for $channel" }
          if ($proof.legacyCustomPack.fixture -cne 'LegacyCustomPack.Build' -or $proof.maintenancePreparedFingerprint -cne $proof.legacyCustomPack.fingerprint) { throw "Native configuration legacy custom pack proof incomplete for $channel" }
          if (@($proof.captures).Count -ne 6 -or @(Get-ChildItem $captures -File -Filter '*.png').Count -ne 6) { throw "Native configuration captures incomplete for $channel" }
          $dialogs = @($proof.dialogObservations)
          if ($dialogs.Count -ne 7 -or @($dialogs | Where-Object { $_.kind -eq 'folder' -and $_.pathRequired }).Count -ne 1) { throw "Native folder selections incomplete for $channel" }
          if (@($dialogs | Where-Object { $_.clicked -ne $true -or $_.closedAfterClick -ne $true -or ($_.pathRequired -and ($_.pathReadBackExact -ne $true -or $_.stableReads -lt 3)) }).Count -ne 0) { throw "Native dialog proof incomplete for $channel" }
          & node tools/pack/make-pack.mjs --verify "out/$channel"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Complete engine, bridge and transaction tests — isolated providers, no AD mutation
        run: |
          $ErrorActionPreference = 'Stop'
          $entrypointSyntax = @'
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) { throw 'Windows PowerShell 5.1 is required for this syntax check.' }
          foreach ($relative in @('tools/qualification/Invoke-NativeUpdateQualification.ps1', 'tools/qualification/Invoke-NativeUpdateUiQualification.ps1')) {
            $entrypoint = Join-Path (Get-Location).Path $relative
            $parseTokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($entrypoint, [ref]$parseTokens, [ref]$parseErrors)
            [ordered]@{ schemaVersion=1; kind='pesto.qualification-entrypoint-syntax'; powershellMajor=$PSVersionTable.PSVersion.Major;
              powershellMinor=$PSVersionTable.PSVersion.Minor; file=$relative; fileSha256=(Get-FileHash -LiteralPath $entrypoint -Algorithm SHA256).Hash.ToLowerInvariant();
              errorCount=@($parseErrors).Count; success=(@($parseErrors).Count -eq 0) } | ConvertTo-Json -Compress
            if (@($parseErrors).Count -ne 0) {
              foreach ($parseError in $parseErrors) { Write-Output ('Line {0}: {1}' -f $parseError.Extent.StartLineNumber, $parseError.ErrorId) }
              exit 2
            }
          }
          '@
          $encodedSyntax = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($entrypointSyntax))
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -EncodedCommand $encodedSyntax 2>&1 | Tee-Object -FilePath out/evidence/Qualification-entrypoint-PS51.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assembly = 'tests/Pesto.Engine.Tests/bin/Release/net10.0/Pesto.Engine.Tests.dll'
          & dotnet $assembly --validate-powershell51 2>&1 | Tee-Object -FilePath out/evidence/PowerShell51-syntax.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dotnet $assembly --validate-powershell-utf8 2>&1 | Tee-Object -FilePath out/evidence/PowerShell51-utf8.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A single sequential invocation covers every [Test], including naming, policy,
          # receipt/recovery and live-write suites that were absent from the old filters.
          # The providers are test doubles and GP/configuration roots are isolated.
          & dotnet $assembly 2>&1 | Tee-Object -FilePath out/evidence/Engine-All.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $socleTests = @(
            'InstallCarriesTheSocleAndRollbackKeepsIt',
            'SocleExactCopyIsAcceptedOutsideThePackIdentity',
            'SocleChangedExtraMissingOrEmptyIsRefused',
            'InstallWithoutSocleNeverCreatesOne',
            'EmbeddedSocleIndexLoadsTheRealRuntimeInventory'
          )
          $engineLog = Get-Content out/evidence/Engine-All.log -Raw
          $allSoclePassed = $true
          foreach ($t in $socleTests) {
            if ($engineLog -notmatch "(?m)^OK\s+UpdateTests\.$t\s*$") { $allSoclePassed = $false }
          }
