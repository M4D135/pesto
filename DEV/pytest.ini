[pytest]
# tests/historique_rc18 garde des fixtures d'une version révolue : leur README dit
# « conservés comme historique, pas comme preuve verte ». Elles restent jouables en
# les nommant explicitement (python3 -m pytest tests/historique_rc18), mais ne doivent
# pas rougir la suite par défaut — une suite toujours rouge n'avertit plus de rien.
# Cette option REMPLACE la liste par défaut de pytest, elle ne s'y ajoute pas : les motifs
# usuels sont repris ici, sinon un paquet frappé dans dist/ serait collecté comme une suite.
norecursedirs = *.egg .* _darcs build CVS dist node_modules venv {arch} historique_rc18
