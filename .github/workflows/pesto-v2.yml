      - name: Start the exact extracted PROD-LIGHT ZIP with the installed Evergreen runtime
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = (Resolve-Path "out/Pesto_V2_PROD-LIGHT_$env:PACK_DISTRIBUTION.zip").Path
          $archiveHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $prodExeHash = (Get-FileHash out/PROD-LIGHT/Pesto.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $owned = Join-Path ([IO.Path]::GetTempPath()) ('Pesto-light-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $owned | Out-Null
          try {
            $extraction = Join-Path $owned 'extracted'
            Expand-Archive -LiteralPath $archive -DestinationPath $extraction
            $roots = @(Get-ChildItem -LiteralPath $extraction -Force)
            if ($roots.Count -ne 1 -or -not $roots[0].PSIsContainer -or $roots[0].Name -cne 'PROD-LIGHT') { throw 'Invalid light archive root.' }
            $pack = $roots[0].FullName
            & node tools/pack/make-pack.mjs --verify $pack
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $manifest = Get-Content (Join-Path $pack 'wad/Pesto.package.json') -Raw | ConvertFrom-Json
            if ($manifest.channel -cne 'PROD' -or $manifest.sourceCommit -cne $env:GITHUB_SHA -or
                $manifest.distribution -cne $env:PACK_DISTRIBUTION -or $manifest.qualification -cne 'unqualified' -or
                $manifest.webview2Runtime -cne 'evergreen' -or (Test-Path -LiteralPath (Join-Path $pack 'wad/runtime/webview2')) -or
                @(Get-ChildItem -LiteralPath $pack -Recurse -File -Filter msedgewebview2.exe).Count -ne 0) { throw 'The light artifact has a wrong manifest or bundles WebView2.' }
            $exe = Join-Path $pack 'Pesto.exe'
            if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $prodExeHash) { throw 'Light executable differs from PROD-LIGHT.' }
            $report = Join-Path $owned 'smoke'
            $process = Start-Process -FilePath $exe -WorkingDirectory $pack -ArgumentList @('--qualify-demo', ('"' + $report + '"')) -PassThru
            if (-not $process.WaitForExit(300000)) {
              & taskkill.exe /PID $process.Id /T /F | Out-Null
              throw 'Extracted light application timed out.'
            }
            $raw = 'out/evidence/native-demo-PROD-LIGHT.json'
            Copy-Item -LiteralPath (Join-Path $report 'proof.json') -Destination $raw
            $proof = Get-Content $raw -Raw | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or $proof.kind -cne 'pesto.windows-demo-qualification' -or $proof.success -ne $true -or
                $proof.ready -ne $true -or $proof.closeReturned -ne $true -or $proof.coexistence.success -ne $true -or
                $proof.adQualification -ne $false -or $proof.binaryUpdateQualification -ne $false -or $proof.realProfileCreated -ne $false -or
                $proof.version -cne $manifest.version -or $proof.channel -cne 'PROD' -or $proof.distribution -cne $manifest.distribution -or
                $proof.runtimeMode -cne 'evergreen' -or $proof.runtimeSource -cne 'evergreen' -or
                $proof.browserVersion -notmatch '^[1-9]\d*\.\d+\.\d+\.\d+$' -or
                $proof.executableSha256 -cne $prodExeHash -or $archiveHash -cne (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Incomplete Evergreen smoke or changed light archive.' }
            [ordered]@{ schemaVersion=1; kind='pesto.release-evergreen-smoke'; sourceCommit=$env:GITHUB_SHA; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT;
              packageChannel='PROD'; version=$manifest.version; archiveSha256=$archiveHash; executableSha256=$prodExeHash;
              nativeProofSha256=(Get-FileHash $raw -Algorithm SHA256).Hash.ToLowerInvariant(); runtimeMode=$proof.runtimeMode; runtimeSource=$proof.runtimeSource; browserVersion=$proof.browserVersion;
              success=$proof.success; ready=$proof.ready; closeReturned=$proof.closeReturned; adQualification=$proof.adQualification; bundledWebView2Absent=$true } |
              ConvertTo-Json | Set-Content -Encoding utf8 out/evidence/prod-light-smoke.json
          } finally { Remove-Item -LiteralPath $owned -Recurse -Force }
      - name: Socle runner check — exact copy valid, altered refused, demo with evergreen
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $harnais = (Resolve-Path 'tools/qualification/Pesto.UpdateQualification/bin/Release/net10.0/Pesto.UpdateQualification.dll').Path
          $dotnet = (Get-Command dotnet.exe -CommandType Application).Source
          $socleRoot = $env:PESTO_SOCLE_ROOT
          if (-not $socleRoot -or -not (Test-Path $socleRoot)) { throw 'PESTO_SOCLE_ROOT not set or missing' }
          $packDir = (Resolve-Path 'out/PROD-LIGHT').Path
          # Baseline fingerprint from the pack without socle
          $baselineJson = & $dotnet $harnais socle-check $packDir
          if ($LASTEXITCODE -ne 0) { throw "socle-check on PROD-LIGHT failed (exit $LASTEXITCODE)" }
          $baseline = $baselineJson | ConvertFrom-Json
          if (-not $baseline.valid) { throw "socle-check on bare PROD-LIGHT must be valid: $($baseline.message)" }
          $baselineFingerprint = $baseline.fingerprint
          $owned = Join-Path ([IO.Path]::GetTempPath()) ('Pesto-socle-runner-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $owned | Out-Null
          try {
            # Copy A: PROD-LIGHT + socle tree
            $copyA = Join-Path $owned 'copyA'
            Copy-Item -LiteralPath $packDir -Destination $copyA -Recurse
            $socleSrc = Join-Path $socleRoot 'wad/runtime/webview2'
            $socleDst = Join-Path $copyA 'wad/runtime/webview2'
            Copy-Item -LiteralPath $socleSrc -Destination $socleDst -Recurse
            $jsonA = & $dotnet $harnais socle-check $copyA
            if ($LASTEXITCODE -ne 0) { throw "socle-check on copy A failed (exit $LASTEXITCODE)" }
            $checkA = $jsonA | ConvertFrom-Json
            if ($checkA.valid -ne $true -or $checkA.soclePresent -ne $true -or $checkA.socleState -cne 'Valid') { throw "Copy A socle-check invalid: $($checkA.message)" }
            if ($checkA.fingerprint -cne $baselineFingerprint) { throw "Copy A fingerprint differs from bare PROD-LIGHT" }
            # Demo on copy A — Evergreen passes first
            $demoReport = Join-Path $owned 'demoA'
            $exeA = Join-Path $copyA 'Pesto.exe'
            $procA = Start-Process -FilePath $exeA -WorkingDirectory $copyA -ArgumentList @('--qualify-demo', ('"' + $demoReport + '"')) -PassThru
            if (-not $procA.WaitForExit(300000)) {
              & taskkill.exe /PID $procA.Id /T /F | Out-Null
              throw 'Demo on copy A timed out'
            }
            if ($procA.ExitCode -ne 0) { throw "Demo on copy A failed (exit $($procA.ExitCode))" }
            $demoProofA = Get-Content (Join-Path $demoReport 'proof.json') -Raw | ConvertFrom-Json
            if (-not $demoProofA.success -or -not $demoProofA.ready -or $demoProofA.runtimeSource -cne 'evergreen') { throw "Copy A demo must report runtimeSource evergreen, got $($demoProofA.runtimeSource)" }
            # Copy B: copy A with one byte added to a non-exe socle file
            $copyB = Join-Path $owned 'copyB'
            Copy-Item -LiteralPath $copyA -Destination $copyB -Recurse
            $socleFiles = @(Get-ChildItem -LiteralPath (Join-Path $copyB 'wad/runtime/webview2') -Recurse -File | Where-Object { $_.Name -cne 'msedgewebview2.exe' } | Sort-Object FullName)
            if ($socleFiles.Count -eq 0) { throw 'No non-exe socle file found to alter' }
            $targetFile = $socleFiles[0]
            $bytes = [IO.File]::ReadAllBytes($targetFile.FullName)
            [IO.File]::WriteAllBytes($targetFile.FullName, ($bytes + [byte]0x00))
            $jsonB = & $dotnet $harnais socle-check $copyB
            if ($LASTEXITCODE -ne 0) { throw "socle-check on copy B failed (exit $LASTEXITCODE)" }
            $checkB = $jsonB | ConvertFrom-Json
            if ($checkB.valid -ne $false -or $checkB.code -cne 'package.socle') { throw "Copy B socle-check must be invalid with code package.socle, got valid=$($checkB.valid) code=$($checkB.code)" }
            [ordered]@{ schemaVersion=1; kind='pesto.socle-runner'; success=$true
              exactCopyValid=$true; fingerprintUnchanged=$true; demoRuntimeSource='evergreen'
              alteredRefusedCode='package.socle'; withoutEvergreenQualified=$false
              withoutEvergreenNote='Le démarrage sur le Socle sans Evergreen est qualifié par la recette sur banc, pas sur le runner.' } |
              ConvertTo-Json | Set-Content -Encoding utf8 out/evidence/socle-runner.json
          } finally { Remove-Item -LiteralPath $owned -Recurse -Force }
      - name: Native PROD-LIGHT cross-build ZIP updates — installation, failure, recovery and rollback in isolated copies
