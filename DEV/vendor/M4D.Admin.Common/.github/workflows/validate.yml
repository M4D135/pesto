name: Common compatibility
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Verified Microsoft net472 references
        run: python tools/bootstrap.py
      - name: Compile CSharp5 net472
        shell: pwsh
        run: ./tools/build.ps1 -Tests
      - name: Pure contracts
        shell: pwsh
        run: ./tools/test.ps1
      - name: Release and version policy tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Isolated WPF contracts on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -STA -ExecutionPolicy RemoteSigned -File tests/Wpf/Run-WpfContracts.ps1 -BundleDirectory dist -ReportPath dist/windows-wpf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: common-${{ runner.os }}
          path: |
            dist/manifest.json
            dist/windows-wpf.json
          if-no-files-found: error
